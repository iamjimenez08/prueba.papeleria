<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Happy Paper — Papelería</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="data.jsx"></script>
  <script type="text/babel" src="components.jsx"></script>
  <script type="text/babel" src="pages.jsx"></script>

  <script type="text/babel">

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "primaryColor": "#2e69b2",
  "density": "regular",
  "cardVariant": "bordered"
} /*EDITMODE-END*/;

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [tab, setTab] = React.useState('home'); // home | catalog | info
  const [admin, setAdmin] = React.useState(false);
  const [products, setProducts] = React.useState(HP_INITIAL_PRODUCTS);
  const [cart, setCart] = React.useState([]);
  const [drawerOpen, setDrawerOpen] = React.useState(false);
  const [checkoutOpen, setCheckoutOpen] = React.useState(false);
  const [toast, setToast] = React.useState('');

  // sync primary color CSS var
  React.useEffect(() => {
    document.documentElement.style.setProperty('--hp-primary', t.primaryColor);
  }, [t.primaryColor]);

  const cartCount = cart.reduce((s, it) => s + it.qty, 0);

  const addToCart = (p) => {
    setCart((cs) => {
      const found = cs.find((c) => c.id === p.id);
      if (found) return cs.map((c) => c.id === p.id ? { ...c, qty: c.qty + 1 } : c);
      return [...cs, { ...p, qty: 1 }];
    });
    setToast(`✓ "${p.name}" agregado al carrito`);
  };
  const setQty = (id, qty) => {
    if (qty <= 0) return setCart((cs) => cs.filter((c) => c.id !== id));
    setCart((cs) => cs.map((c) => c.id === id ? { ...c, qty } : c));
  };
  const removeItem = (id) => setCart((cs) => cs.filter((c) => c.id !== id));
  const goCatalog = () => {setTab('catalog');window.scrollTo({ top: 0, behavior: 'smooth' });};

  // Checkout view takes over the screen
  if (checkoutOpen) {
    return (
      <>
            <HPCheckout items={cart} primary={t.primaryColor}
        onClose={() => setCheckoutOpen(false)}
        onComplete={() => {setCart([]);setCheckoutOpen(false);setTab('home');setToast('¡Gracias por tu compra!');}} />
            <HPToast msg={toast} onDone={() => setToast('')} />
            <Tweaks t={t} setTweak={setTweak} />
          </>);

  }

  return (
    <div className="hp-app">
          <nav className="hp-nav" data-screen-label="Nav">
            <div className="hp-logo" onClick={() => {setAdmin(false);setTab('home');}}>
              <div className="hp-logo-mark">H</div>
              <div className="hp-logo-text">Happy Paper<small>Papelería · CDMX</small></div>
            </div>
            {!admin &&
        <div className="hp-tabs">
                <button className={`hp-tab ${tab === 'home' ? 'on' : ''}`} onClick={() => setTab('home')}>Inicio</button>
                <button className={`hp-tab ${tab === 'catalog' ? 'on' : ''}`} onClick={() => setTab('catalog')}>Productos</button>
                <button className={`hp-tab ${tab === 'info' ? 'on' : ''}`} onClick={() => setTab('info')}>Información</button>
              </div>
        }
            {admin && <div className="hp-tabs"><span className="hp-tab on">Vista de administrador</span></div>}
            <div className="hp-nav-actions">
              {!admin &&
          <button className="hp-cartbtn" onClick={() => setDrawerOpen(true)}>
                  <span>🛒</span> Carrito
                  {cartCount > 0 && <span className="hp-cartcount">{cartCount}</span>}
                </button>
          }
              <button className={`hp-adminbtn ${admin ? 'on' : ''}`} onClick={() => setAdmin(!admin)}>
                {admin ? '← Vista cliente' : '⚙ Admin'}
              </button>
            </div>
          </nav>

          {admin ?
      <div data-screen-label="Admin"><HPAdmin products={products} setProducts={setProducts} primary={t.primaryColor} /></div> :
      tab === 'home' ?
      <div data-screen-label="Home"><HPHome products={products} onAdd={addToCart} onGoCatalog={goCatalog}
        primary={t.primaryColor} density={t.density} cardVariant={t.cardVariant} /></div> :
      tab === 'catalog' ?
      <div data-screen-label="Catalog"><HPCatalog products={products} onAdd={addToCart}
        primary={t.primaryColor} density={t.density} cardVariant={t.cardVariant} /></div> :

      <div data-screen-label="Info"><HPInfo primary={t.primaryColor} /></div>
      }

          <footer className="hp-footer">
            <div>
              <b>Happy Paper</b>
              <p>Papelería · ©2026</p>
            </div>
            <div className="hp-footer-cols">
              <a href="#" onClick={(e) => e.preventDefault()}>Términos</a>
              <a href="#" onClick={(e) => e.preventDefault()}>Privacidad</a>
              <a href="#" onClick={(e) => e.preventDefault()}>Envíos</a>
            </div>
          </footer>

          <HPCartDrawer open={drawerOpen} onClose={() => setDrawerOpen(false)}
      items={cart} setQty={setQty} removeItem={removeItem}
      onCheckout={() => {setDrawerOpen(false);setCheckoutOpen(true);}}
      primary={t.primaryColor} />

          <HPToast msg={toast} onDone={() => setToast('')} />

          <Tweaks t={t} setTweak={setTweak} />
        </div>);

}

function Tweaks({ t, setTweak }) {
  return (
    <TweaksPanel title="Tweaks · Happy Paper">
          <TweakSection label="Marca" />
          <TweakColor label="Color principal" value={t.primaryColor}
      onChange={(v) => setTweak('primaryColor', v)} />

          <TweakSection label="Catálogo" />
          <TweakRadio label="Densidad" value={t.density}
      options={[
      { value: 'compact', label: 'Compacto' },
      { value: 'regular', label: 'Regular' },
      { value: 'comfy', label: 'Espacioso' }]
      }
      onChange={(v) => setTweak('density', v)} />
          <TweakRadio label="Estilo de tarjeta" value={t.cardVariant}
      options={[
      { value: 'bordered', label: 'Borde' },
      { value: 'soft', label: 'Suave' },
      { value: 'minimal', label: 'Mínimo' }]
      }
      onChange={(v) => setTweak('cardVariant', v)} />
        </TweaksPanel>);

}

// Footer styles inline (small, doesn't merit its own file)
const footerCSS = document.createElement('style');
footerCSS.textContent = `
      .hp-footer { margin-top: 60px; padding: 32px; border-top: 1px solid #e5e7eb; background: #fff;
        display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px; }
      .hp-footer b { font-family: 'Bricolage Grotesque', sans-serif; font-size: 16px; }
      .hp-footer p { margin: 4px 0 0; color: #6b7280; font-size: 13px; }
      .hp-footer-cols { display: flex; gap: 20px; }
      .hp-footer-cols a { font-size: 14px; color: #6b7280; text-decoration: none; }
      .hp-footer-cols a:hover { color: #0e1116; }
    `;
document.head.appendChild(footerCSS);

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
